name: code-build-artifacts

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to build
        required: true
        type: string
      platforms:
        description: JSON array, for example ["windows","android"]
        required: true
        type: string
      build_mode:
        description: Flutter build mode
        required: true
        type: choice
        options: [debug, profile, release]
      artifact_formats:
        description: JSON object, for example {"windows":"bundle"}
        required: true
        type: string
      confirmation:
        description: Confirm every requested platform, mode, and format
        required: true
        type: choice
        options: [confirmed]

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Reject unconfirmed or malformed dispatch before checkout
        id: validate
        continue-on-error: true
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          PLATFORMS: ${{ inputs.platforms }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p 'logs/code-build-agent'
          if ! python3 .github/scripts/validate_build_inputs.py \
            --platforms "$PLATFORMS" \
            --artifact-formats "${{ inputs.artifact_formats }}" \
            --build-mode "${{ inputs.build_mode }}" \
            --confirmation "$CONFIRMATION" > /dev/null 2>&1; then
            status='blocked'
            summary='Dispatch inputs failed pre-check.'
            failure='true'
          else
            status='completed'
            summary='Dispatch inputs passed pre-check.'
            failure=''
          fi
          python3 << 'EOF'
          import json
          from datetime import datetime, timezone
          report = {
              'agent': 'code-build-agent',
              'runId': '${{ github.run_id }}',
              'taskId': '${{ github.run_id }}',
              'timestamp': datetime.now(timezone.utc).isoformat(),
              'status': '$status',
              'summary': '$summary',
              'confidence': 1.0
          }
          with open('logs/code-build-agent/${{ github.run_id }}.json', 'w') as f:
              json.dump(report, f, indent=2)
          EOF
          if [ -n "$failure" ]; then exit 1; fi
      - name: Upload preflight report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-build-preflight-${{ github.run_id }}
          path: logs/code-build-agent/${{ github.run_id }}.json
          retention-days: 14
      - name: Stop after failed preflight
        if: steps.validate.outcome == 'failure'
        run: exit 1

  prepare:
    needs: preflight
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      matrix: ${{ steps.normalize.outputs.matrix }}
      build_mode: ${{ steps.normalize.outputs.build_mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - name: Resolve immutable source and protected branch relation
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Resolved commit: $sha"
          if git show-ref --verify --quiet refs/remotes/origin/main; then
            git merge-base --is-ancestor origin/main HEAD || { echo 'Requested ref is behind origin/main.'; exit 1; }
            echo 'Protected branch comparison: requested ref contains origin/main.'
          else
            echo 'Protected branch comparison unavailable; no origin/main ref was fetched.'
          fi
      - name: Normalize and validate selected matrix
        id: normalize
        shell: bash
        env:
          PLATFORMS: ${{ inputs.platforms }}
          FORMATS: ${{ inputs.artifact_formats }}
          BUILD_MODE: ${{ inputs.build_mode }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          result=$(python3 .github/scripts/validate_build_inputs.py \
            --platforms "$PLATFORMS" \
            --artifact-formats "$FORMATS" \
            --build-mode "$BUILD_MODE" \
            --confirmation "$CONFIRMATION")
          matrix=$(echo "$result" | python3 -c "import sys, json; data=json.load(sys.stdin); print(json.dumps(data['matrix'], separators=(',', ':')))")
          build_mode=$(echo "$result" | python3 -c "import sys, json; data=json.load(sys.stdin); print(data['build_mode'])")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "build_mode=$build_mode" >> "$GITHUB_OUTPUT"

  quality:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 1
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Resolve workspace
        run: dart pub get
      - name: Generate Drift sources
        working-directory: data
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze workspace
        run: flutter analyze
      - name: Run scoped package tests
        run: |
          dart test --reporter compact
        working-directory: core
      - name: Test data package
        run: flutter test --reporter compact
        working-directory: data
      - name: Test UI package
        run: flutter test --reporter compact
        working-directory: ui
      - name: Test desktop shell
        run: flutter test test/widget_test.dart --reporter compact
        working-directory: apps/desktop
      - name: Test mobile shell
        run: flutter test test/widget_test.dart --reporter compact
        working-directory: apps/mobile
      - name: Record quality gate
        run: echo "Quality gates passed for ${{ needs.prepare.outputs.sha }}"

  build:
    needs: [prepare, quality]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 1
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install Linux desktop dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev
      - name: Verify macOS and iOS toolchains
        if: matrix.platform == 'macos' || matrix.platform == 'ios'
        run: |
          flutter doctor -v
          xcode-select -p
          xcodebuild -version
          xcrun simctl list runtimes
      - name: Verify iOS simulator runtime
        if: matrix.platform == 'ios'
        run: xcrun simctl list runtimes | grep -q 'iOS'
      - name: Verify Linux desktop toolchain
        if: matrix.platform == 'linux'
        run: |
          flutter doctor -v
          cmake --version
          ninja --version
          pkg-config --modversion gtk+-3.0
      - name: Enable desktop target
        if: matrix.platform == 'windows' || matrix.platform == 'macos' || matrix.platform == 'linux'
        run: flutter config --enable-${{ matrix.platform }}-desktop
      - name: Resolve workspace and generate sources
        run: |
          dart pub get

      - name: Generate Drift sources
        working-directory: data
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Build confirmed target
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          MODE: ${{ needs.prepare.outputs.build_mode }}
        run: |
          set -euo pipefail
          mode_flag="--$MODE"
          case "$PLATFORM" in
            windows)
              cd apps/desktop
              flutter build windows $mode_flag
              cd ../..
              ;;
            macos)
              cd apps/desktop
              flutter build macos $mode_flag
              cd ../..
              ;;
            linux)
              cd apps/desktop
              flutter build linux $mode_flag
              cd ../..
              ;;
            android)
              cd apps/mobile
              flutter build apk --release
              cd ../..
              ;;
            ios)
              cd apps/mobile
              flutter build ios --simulator --no-codesign $mode_flag
              cd ../..
              ;;
            *)
              echo "Unexpected platform: $PLATFORM"
              exit 1
              ;;
          esac
      - name: Collect real output
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/collect_build_artifacts.py \
            --platform '${{ matrix.platform }}' \
            --build-mode '${{ needs.prepare.outputs.build_mode }}' \
            --format '${{ matrix.format }}' \
            --workspace "$PWD" \
            --staging-directory "$PWD/artifact-staging"
      - name: Generate manifest and checksums
        shell: bash
        run: |
          set -euo pipefail
          flutter_version=$(flutter --version | head -1)
          dart_version=$(dart --version 2>&1 | head -1)
          python3 .github/scripts/write_build_manifest.py \
            --staging-directory "$PWD/artifact-staging" \
            --output-directory "$PWD/artifact-staging/report" \
            --source-ref '${{ inputs.ref }}' \
            --commit-sha '${{ needs.prepare.outputs.sha }}' \
            --run-id '${{ github.run_id }}' \
            --runner-os '${{ runner.os }}' \
            --flutter-version "$flutter_version" \
            --dart-version "$dart_version"
      - name: Write structured report
        shell: bash
        run: |
          set -euo pipefail
          report_dir='artifact-staging/report/logs/code-build-agent'
          mkdir -p "$report_dir"
          python3 << 'EOF'
          import json
          from datetime import datetime, timezone
          report = {
              'agent': 'code-build-agent',
              'runId': '${{ github.run_id }}-${{ matrix.platform }}',
              'taskId': '${{ github.run_id }}',
              'timestamp': datetime.now(timezone.utc).isoformat(),
              'status': 'completed',
              'summary': 'Built confirmed artifact from pinned commit.',
              'confidence': 1.0,
              'artifacts': [
                  {'kind': 'artifact-manifest', 'ref': 'manifest.json'},
                  {'kind': 'checksum', 'ref': 'SHA256SUMS'},
                  {'kind': 'actions-artifact', 'ref': 'code-build-${{ matrix.platform }}-${{ needs.prepare.outputs.build_mode }}-${{ needs.prepare.outputs.sha }}'},
                  {'kind': 'log', 'ref': 'logs/code-build-agent/${{ github.run_id }}-${{ matrix.platform }}.json'}
              ]
          }
          with open('$report_dir/${{ github.run_id }}-${{ matrix.platform }}.json', 'w') as f:
              json.dump(report, f, indent=2)
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: code-build-${{ matrix.platform }}-${{ needs.prepare.outputs.build_mode }}-${{ needs.prepare.outputs.sha }}
          path: artifact-staging
          retention-days: 14