name: review-agent

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Resolve workspace
        run: dart pub get

      - name: Run deterministic review checks
        id: review
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set +e
          failures=()

          git diff --check "$BASE_SHA"...HEAD
          if (( $? != 0 )); then
            failures+=("whitespace errors in the pull-request diff")
          fi

          if git diff --name-only "$BASE_SHA"...HEAD | grep -Eiq '(^|/)(\.env|.*\.(pem|key|p12|pfx))$'; then
            failures+=("potential credential or private-key file added to the diff")
          fi

          if git diff "$BASE_SHA"...HEAD | grep -Eiq '(^|[[:space:]])(AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9_]{20,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)'; then
            failures+=("potential credential material found in the diff")
          fi

          flutter analyze
          if (( $? != 0 )); then
            failures+=("dart analyze reported errors")
          fi

          if (( ${#failures[@]} == 0 )); then
            verdict=success
            summary="No blocking review findings; diff, secret-pattern, and Dart analysis checks passed."
          else
            verdict=failure
            summary="Blocking review findings: ${failures[*]}"
          fi

          {
            echo "verdict=$verdict"
            echo "summary<<REVIEW_SUMMARY"
            echo "$summary"
            echo "REVIEW_SUMMARY"
          } >> "$GITHUB_OUTPUT"

      - name: Publish review verdict check
        if: always()
        uses: actions/github-script@v7
        env:
          VERDICT: ${{ steps.review.outputs.verdict || 'failure' }}
          SUMMARY: ${{ steps.review.outputs.summary || 'Review workflow did not produce a verdict.' }}
        with:
          script: |
            const conclusion = process.env.VERDICT === 'success' ? 'success' : 'failure';
            const check = await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'review-agent/verdict',
              head_sha: context.payload.pull_request.head.sha,
              status: 'completed',
              conclusion,
              output: {
                title: conclusion === 'success' ? 'Review approved' : 'Review requires changes',
                summary: process.env.SUMMARY,
              },
            });

            const marker = '<!-- review-agent/verdict -->';
            const body = `${marker}\n**review-agent/verdict:** ${conclusion}\n\n${process.env.SUMMARY}`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              per_page: 100,
            });
            const existing = comments.find((comment) =>
              comment.user.type === 'Bot' && comment.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body,
              });
            }

            core.setOutput('check-run-id', check.data.id);

      - name: Fail review gate when findings exist
        if: steps.review.outputs.verdict != 'success'
        run: exit 1
