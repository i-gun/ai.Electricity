name: ci-build-test

# Cross-platform build+test matrix required by Testing Agent's gate (see agents/testing-agent.yaml
# and docs/platform-matrix.md). Failure here is routed by router-ci-failure.yml to
# error-resolution-agent.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  checks: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
          - os: macos-latest
            target: macos
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Enable desktop target
        run: flutter config --enable-${{ matrix.target }}-desktop
      - name: Analyze
        run: flutter analyze
      - name: Unit + widget tests with coverage
        run: flutter test --coverage
      - name: Build ${{ matrix.target }}
        run: flutter build ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.target }}
          path: coverage/lcov.info

  mobile:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: android
          - os: macos-latest
            target: ios
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Analyze
        run: flutter analyze
      - name: Unit + widget tests with coverage
        run: flutter test --coverage
      - name: Build Android (debug APK)
        if: matrix.target == 'android'
        run: flutter build apk --debug
      - name: Build iOS (simulator)
        if: matrix.target == 'ios'
        run: flutter build ios --simulator --no-codesign
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.target }}
          path: coverage/lcov.info

  coverage-gate:
    needs: [desktop, mobile]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: coverage-artifacts
      - name: Enforce coverage thresholds (see agents/testing-agent.yaml)
        run: |
          echo "Aggregating coverage-artifacts/* and enforcing >=90% overall, 100% for core/business-logic/**"
          # Placeholder aggregation step: replace with lcov merge + threshold check tooling.
