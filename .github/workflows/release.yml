name: release (Version Control Agent)

# Builds release binaries from a SemVer tag and publishes them to its GitHub Release.
# Never force-pushes or rewrites history; see agents/version-control-agent.yaml.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing SemVer tag to build and publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  validate-release:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.validate.outputs.tag }}
      sha: ${{ steps.validate.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate release tag
        id: validate
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a SemVer tag like v1.2.3, got: $RELEASE_TAG"
            exit 1
          fi
          commit_sha=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$commit_sha" >> "$GITHUB_OUTPUT"

  build-release-assets:
    needs: validate-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-latest
          - platform: macos
            runner: macos-latest
          - platform: linux
            runner: ubuntu-24.04
          - platform: android
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate-release.outputs.sha }}
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Provision Android release keystore
        if: matrix.platform == 'android'
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "Required Android signing secret is missing: $name"
              exit 1
            fi
          done
          if [[ ! "$ANDROID_SIGNING_CERT_SHA256" =~ ^[a-fA-F0-9]{64}$ ]]; then
            echo 'ANDROID_SIGNING_CERT_SHA256 must contain the 64-character release certificate digest.'
            exit 1
          fi
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/android-release.jks" >> "$GITHUB_ENV"
      - name: Install Linux desktop dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev libsecret-1-dev libsecret-1-0
      - name: Enable desktop target
        if: matrix.platform != 'android'
        run: flutter config --enable-${{ matrix.platform }}-desktop
      - name: Resolve workspace and generate sources
        run: dart pub get
      - name: Generate Drift sources
        run: dart run build_runner build --delete-conflicting-outputs
        working-directory: data
      - name: Build release binary
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          GOOGLE_OAUTH_DESKTOP_CLIENT_ID: ${{ matrix.platform != 'android' && vars['GOOGLE_OAUTH_DESKTOP_CLIENT_ID'] || '' }}
          GOOGLE_OAUTH_DESKTOP_CLIENT_SECRET: ${{ matrix.platform != 'android' && secrets['GOOGLE_OAUTH_DESKTOP_CLIENT_SECRET'] || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ matrix.platform == 'android' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          ANDROID_KEY_ALIAS: ${{ matrix.platform == 'android' && secrets.ANDROID_KEY_ALIAS || '' }}
          ANDROID_KEY_PASSWORD: ${{ matrix.platform == 'android' && secrets.ANDROID_KEY_PASSWORD || '' }}
          GOOGLE_OAUTH_WEB_CLIENT_ID: ${{ matrix.platform == 'android' && vars['GOOGLE_OAUTH_WEB_CLIENT_ID'] || '' }}
        run: |
          set -euo pipefail
          oauth_defines=()
          if [[ "$PLATFORM" == "android" ]]; then
            if [[ ! "${GOOGLE_OAUTH_WEB_CLIENT_ID:-}" =~ ^[A-Za-z0-9-]+\.apps\.googleusercontent\.com$ ]]; then
              echo 'GOOGLE_OAUTH_WEB_CLIENT_ID repository variable must contain the public Web OAuth client ID.'
              exit 1
            fi
            oauth_defines+=(--dart-define="GOOGLE_OAUTH_WEB_CLIENT_ID=$GOOGLE_OAUTH_WEB_CLIENT_ID")
          fi
          if [[ "$PLATFORM" != "android" ]]; then
            if [[ -n "${GOOGLE_OAUTH_DESKTOP_CLIENT_ID:-}" && -n "${GOOGLE_OAUTH_DESKTOP_CLIENT_SECRET:-}" ]]; then
              oauth_defines+=(--dart-define="GOOGLE_OAUTH_DESKTOP_CLIENT_ID=$GOOGLE_OAUTH_DESKTOP_CLIENT_ID")
              oauth_defines+=(--dart-define="GOOGLE_OAUTH_DESKTOP_CLIENT_SECRET=$GOOGLE_OAUTH_DESKTOP_CLIENT_SECRET")
            elif [[ -n "${GOOGLE_OAUTH_DESKTOP_CLIENT_ID:-}" || -n "${GOOGLE_OAUTH_DESKTOP_CLIENT_SECRET:-}" ]]; then
              echo 'Configure both GOOGLE_OAUTH_DESKTOP_CLIENT_ID and GOOGLE_OAUTH_DESKTOP_CLIENT_SECRET, or neither.'
              exit 1
            fi
          fi
          case "$PLATFORM" in
            windows)
              cd apps/desktop
              flutter build windows --release "${oauth_defines[@]}"
              cd ../..
              ;;
            macos)
              cd apps/desktop
              flutter build macos --release "${oauth_defines[@]}"
              cd ../..
              ;;
            linux)
              cd apps/desktop
              flutter build linux --release "${oauth_defines[@]}"
              cd ../..
              ;;
            android)
              cd apps/mobile
              flutter build apk --release "${oauth_defines[@]}"
              cd ../..
              ;;
            *)
              echo "Unexpected platform: $PLATFORM"
              exit 1
              ;;
          esac
      - name: Verify Android APK signature and release certificate
        if: matrix.platform == 'android'
        shell: pwsh
        env:
          ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          ./.github/scripts/verify_android_apk.ps1 `
            -ApkPath apps/mobile/build/app/outputs/flutter-apk/app-release.apk `
            -ExpectedCertificateSha256 $env:ANDROID_SIGNING_CERT_SHA256
      - name: Package Windows release binary
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          VERSION: ${{ needs.validate-release.outputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path 'release-assets' | Out-Null
          $archivePath = "release-assets/ai-electricity-windows-$env:VERSION.zip"
          Compress-Archive `
            -Path 'apps/desktop/build/windows/x64/runner/Release/*' `
            -DestinationPath $archivePath `
            -CompressionLevel Optimal
          if (!(Test-Path -LiteralPath $archivePath) -or (Get-Item -LiteralPath $archivePath).Length -eq 0) {
            throw "Windows release archive was not created: $archivePath"
          }

      - name: Package non-Windows release binary
        if: matrix.platform != 'windows'
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          VERSION: ${{ needs.validate-release.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          case "$PLATFORM" in
            macos)
              app_path=$(find apps/desktop/build/macos/Build/Products/Release -name '*.app' -type d | head -1)
              if [ -z "$app_path" ]; then
                echo "No macOS application bundle was produced."
                exit 1
              fi
              cd "$(dirname "$app_path")"
              zip -r "$OLDPWD/release-assets/ai-electricity-macos-$VERSION.zip" "$(basename "$app_path")"
              cd "$OLDPWD"
              ;;
            linux)
              tar -czf "release-assets/ai-electricity-linux-$VERSION.tar.gz" \
                -C apps/desktop/build/linux/x64/release bundle
              ;;
            android)
              cp apps/mobile/build/app/outputs/flutter-apk/app-release.apk \
                "release-assets/ai-electricity-android-$VERSION.apk"
              ;;
            *)
              echo "Unexpected platform: $PLATFORM"
              exit 1
              ;;
          esac
      - uses: actions/upload-artifact@v7
        with:
          name: release-assets-${{ matrix.platform }}-${{ github.run_id }}
          path: release-assets
          if-no-files-found: error
          retention-days: 7
      - name: Remove Android release keystore
        if: always() && matrix.platform == 'android'
        shell: bash
        run: rm -f "$RUNNER_TEMP/android-release.jks"

  publish-release:
    needs: [validate-release, build-release-assets]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-assets-*
          path: release-assets
          merge-multiple: true
      - name: Verify complete release asset set
        working-directory: release-assets
        env:
          TAG: ${{ needs.validate-release.outputs.tag }}
        run: |
          set -euo pipefail
          expected_assets=(
            "ai-electricity-windows-$TAG.zip"
            "ai-electricity-macos-$TAG.zip"
            "ai-electricity-linux-$TAG.tar.gz"
            "ai-electricity-android-$TAG.apk"
          )
          for asset in "${expected_assets[@]}"; do
            if [[ ! -s "$asset" ]]; then
              echo "Required release asset is missing or empty: $asset"
              exit 1
            fi
          done
      - name: Generate checksums
        working-directory: release-assets
        env:
          TAG: ${{ needs.validate-release.outputs.tag }}
          COMMIT_SHA: ${{ needs.validate-release.outputs.sha }}
        run: |
          sha256sum * > SHA256SUMS
          jq -n --arg tag "$TAG" --arg commit "$COMMIT_SHA" \
            --argjson assets "$(find . -maxdepth 1 -type f ! -name 'SHA256SUMS' -printf '%f\n' | jq -R -s 'split("\n") | map(select(length > 0))')" \
            '{schema: "github-release-manifest/v1", tag: $tag, commit_sha: $commit, assets: $assets}' > manifest.json
      - name: Create or update GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate-release.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if gh release view "$TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber --repo "$REPOSITORY"
          else
            gh release create "$TAG" release-assets/* --generate-notes --verify-tag --repo "$REPOSITORY"
          fi
