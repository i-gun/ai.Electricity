name: release (Version Control Agent)

# Triggered on SemVer tag push. Generates changelog + GitHub Release.
# Never force-pushes or rewrites history; see agents/version-control-agent.yaml.

on:
  create:

permissions:
  contents: write

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate changelog from Conventional Commits
        run: |
          echo "Generate/prepend CHANGELOG.md entry for ${{ github.ref_name }} from git log since previous tag."
      - name: Create GitHub Release
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: context.ref.replace('refs/tags/', ''),
              generate_release_notes: true
            });
